name: Update FINRA margin statistics

on:
  schedule:
    # FINRA releases ~3rd week of the following month; check on the 20th & 25th
    - cron: "0 14 20,25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pandas openpyxl lxml html5lib
      - name: Fetch FINRA margin statistics
        run: python scripts/fetch_finra.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finra.json
          if git diff --staged --quiet; then
            echo "No change in FINRA data."
          else
            git commit -m "chore: update FINRA margin statistics"
            git push
          fi
