name: Update AAII sentiment

on:
  schedule:
    # AAII 每週四(美東)公布一次。每天 22:00 UTC(≈美東下午)檢查一次,
    # 只有在出現新一週時才會提交,等同於每期公布當天即更新。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pandas xlrd openpyxl
      - name: Fetch AAII sentiment
        run: python scripts/fetch_aaii.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aaii.json
          if git diff --staged --quiet; then
            echo "No change in AAII data."
          else
            git commit -m "chore: update AAII sentiment data"
            git push
          fi
